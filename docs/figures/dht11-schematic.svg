<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="Schematic: the ESP32's 3V3 pin (row B, pin 1) feeds both the OLED VCC and the DHT11 plus pin. GND (row A, pin 7) goes to the DHT11 minus pin. GPIO23 (row A, pin 2) goes to the DHT11 S data pin, which has a pull-up resistor to 3.3 V on the module. The OLED keeps its own GND, SDA and SCL wires. Nothing runs at 5 V.">
<style>
svg { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; }
text { fill: #17191a; font-size: 12px; }
.h { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 16px; }
.t { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 15px; }
.m { fill: #5b625e; font-size: 11px; }
.pcb { fill: #1d2733; } .can { fill: #b9bec5; stroke: #8b9097; } .usb { fill: #c8cbd0; stroke: #8b9097; }
.pl { fill: #c9d2dc; font-size: 10px; } .pu { fill: #ffd34d; font-size: 10px; font-weight: 700; }
.px { fill: #ff8a80; font-size: 10px; }
.pin { fill: #9aa3ad; } .wire { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.bad { fill: #c2382b; font-weight: 600; font-size: 11px; }
.scr { fill: #08131f; } .st { fill: #7fd3ff; font-size: 9px; }
.box { fill: #f4f5f2; stroke: #17191a; stroke-width: 1.5; }
.w { fill: none; stroke-width: 2.5; }
.new { fill: #e9f6ee; stroke: #1a8a4a; stroke-width: 1.5; }
</style>
<rect width="860" height="380" fill="#ffffff"/>
<text class="h" x="30" y="34">DHT11 to ESP32: schematic</text>
<text class="m" x="30" y="52">3 wires, all 3.3 V. The OLED (see oled-schematic.svg) shares only the 3V3 pin.</text>
<rect class="box" x="40" y="80" width="250" height="250" rx="6"/>
<text class="t" x="165" y="108" text-anchor="middle">ESP32, 38-pin USB-C</text>
<text class="m" x="165" y="125" text-anchor="middle">WROOM-32 · DevKitC layout</text>
<text class="" x="280" y="174" text-anchor="end" style="fill:#d8352a;font-weight:600">3V3 · B1</text>
<line class="w" stroke="#d8352a" x1="290" y1="170" x2="560" y2="170"/>
<circle cx="290" cy="170" r="3.5" fill="#d8352a"/>
<circle cx="400" cy="170" r="4.5" fill="#d8352a"/>
<line class="w" stroke="#d8352a" x1="400" y1="170" x2="400" y2="96"/><line class="w" stroke="#d8352a" x1="400" y1="96" x2="420" y2="96"/>
<rect class="box" x="420" y="74" width="120" height="44" rx="6"/>
<text class="t" x="480" y="94" text-anchor="middle">SSD1306</text>
<text class="m" x="480" y="110" text-anchor="middle">VCC (OLED)</text>
<text class="m" x="408" y="188">splitter</text>
<text class="" x="280" y="244" text-anchor="end" style="fill:#1a8a4a;font-weight:600">23 · A2</text>
<line class="w" stroke="#1a8a4a" x1="290" y1="240" x2="560" y2="240"/>
<circle cx="290" cy="240" r="3.5" fill="#1a8a4a"/>
<text class="" x="280" y="304" text-anchor="end" style="fill:#1f1f1f;font-weight:600">GND · A7</text>
<line class="w" stroke="#1f1f1f" x1="290" y1="300" x2="560" y2="300"/>
<circle cx="290" cy="300" r="3.5" fill="#1f1f1f"/>
<text class="m" x="470" y="230" text-anchor="middle">data (single wire)</text>
<text class="m" x="490" y="160" text-anchor="middle">3.3 V</text>
<text class="m" x="470" y="290" text-anchor="middle">0 V</text>
<rect class="new" x="560" y="110" width="270" height="230" rx="6"/>
<text class="t" x="695" y="134" text-anchor="middle">DHT11 module</text>
<text class="m" x="695" y="150" text-anchor="middle">20–90 %RH ±5 · 0–50 °C ±2</text>
<circle cx="560" cy="170" r="3.5" fill="#d8352a"/><text x="570" y="163" style="fill:#d8352a;font-weight:700">+</text>
<circle cx="560" cy="240" r="3.5" fill="#1a8a4a"/><text x="570" y="233" style="fill:#1a8a4a;font-weight:700">S</text>
<circle cx="560" cy="300" r="3.5" fill="#1f1f1f"/><text x="570" y="293" style="fill:#1f1f1f;font-weight:700">−</text>
<line class="w" stroke="#d8352a" x1="560" y1="170" x2="610" y2="170"/>
<path d="M610,170 L610,186 L602,190 L618,196 L602,202 L618,208 L602,214 L610,218 L610,240" fill="none" stroke="#17191a" stroke-width="1.8"/>
<line class="w" stroke="#1a8a4a" x1="560" y1="240" x2="730" y2="240"/>
<text class="m" x="624" y="206">pull-up</text>
<text class="m" x="624" y="220">(on module)</text>
<rect x="730" y="214" width="84" height="104" rx="4" fill="#3d8fd6"/>
<text x="772" y="262" text-anchor="middle" style="fill:#ffffff;font-weight:700">DHT11</text>
<text x="772" y="278" text-anchor="middle" style="fill:#e6f0fb;font-size:10px">sensor</text>
<line class="w" stroke="#1f1f1f" x1="560" y1="300" x2="730" y2="300"/>
<text class="m" x="40" y="356">⚠ 3V3, never 5V: the pull-up would put 5 V on GPIO23.</text>
<text class="m" x="830" y="356" text-anchor="end">pin order varies: match the S / + / − labels</text>
</svg>
